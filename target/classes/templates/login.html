<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">登录 - 奶茶君</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #FF6B9D;
            --secondary-color: #FFB6C1;
            --accent-color: #FF8C42;
            --dark-color: #2D3436;
            --light-color: #FFF5F8;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #FFF5F8 0%, #FFE4EC 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            max-width: 420px;
            width: 100%;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(255, 107, 157, 0.15);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .login-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--dark-color);
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #888;
            font-size: 0.95rem;
        }

        .form-floating {
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 12px;
            border: 2px solid #eee;
            padding: 15px;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(255, 107, 157, 0.25);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            border: none;
            border-radius: 12px;
            color: white;
            transition: all 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
        }

        .login-btn:disabled {
            background: #ccc;
            transform: none;
            box-shadow: none;
        }

        .error-message {
            background: #fff5f5;
            color: #e74c3c;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }

        .error-message.show {
            display: block;
        }

        .input-hint {
            font-size: 0.85rem;
            color: #999;
            margin-top: 5px;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .back-home a:hover {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #eee;
        }

        .divider span {
            padding: 0 15px;
            color: #999;
            font-size: 0.9rem;
        }

        .features {
            background: var(--light-color);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #666;
        }

        .feature-item:last-child {
            margin-bottom: 0;
        }

        .feature-item i {
            color: var(--primary-color);
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="bi bi-cup-straw"></i>
                </div>
                <h1 class="login-title">奶茶君</h1>
                <p class="login-subtitle">输入手机号登录，新用户自动注册</p>
            </div>

            <div class="error-message" id="errorMessage">
                <i class="bi bi-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-floating">
                    <input type="text" class="form-control" id="userId" placeholder="请输入手机号"
                           pattern="[0-9]+" title="请输入纯数字" required>
                    <label for="userId"><i class="bi bi-phone"></i> 手机号码</label>
                    <div class="input-hint">请输入纯数字，如：13800138000</div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="bi bi-box-arrow-in-right"></i> 登录 / 注册
                </button>
            </form>

            <div class="divider">
                <span>登录后可享受</span>
            </div>

            <div class="features">
                <div class="feature-item">
                    <i class="bi bi-stars"></i>
                    <span>AI智能推荐，精准匹配您的口味</span>
                </div>
                <div class="feature-item">
                    <i class="bi bi-clock-history"></i>
                    <span>保存历史记录，越用越懂你</span>
                </div>
                <div class="feature-item">
                    <i class="bi bi-heart"></i>
                    <span>收藏喜爱的奶茶，一键再点</span>
                </div>
            </div>

            <div class="back-home">
                <a href="/"><i class="bi bi-house"></i> 返回首页</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorDiv.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.remove('show');
        }

        function setLoading(loading) {
            const btn = document.getElementById('loginBtn');
            const input = document.getElementById('userId');

            if (loading) {
                btn.disabled = true;
                input.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>处理中...';
            } else {
                btn.disabled = false;
                input.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> 登录 / 注册';
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideError();

            const userId = document.getElementById('userId').value.trim();

            // 验证是否为纯数字
            if (!/^\d+$/.test(userId)) {
                showError('请输入纯数字的手机号');
                return false;
            }

            // 验证长度
            if (userId.length < 4 || userId.length > 15) {
                showError('手机号长度应在4-15位之间');
                return false;
            }

            setLoading(true);

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userId: userId })
                });

                const result = await response.json();

                if (result.success) {
                    // 保存登录状态
                    localStorage.setItem('userId', userId);
                    localStorage.setItem('userName', result.userName || userId);

                    if (result.isNewUser) {
                        // 新用户跳转到完善信息页面
                        window.location.href = '/profile/setup';
                    } else {
                        // 老用户跳转到首页
                        window.location.href = '/home';
                    }
                } else {
                    showError(result.message || '登录失败，请重试');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('网络错误，请检查连接后重试');
            } finally {
                setLoading(false);
            }

            return false;
        }

        // 检查是否已登录
        window.onload = function() {
            const userId = localStorage.getItem('userId');
            if (userId) {
                // 已登录，直接跳转
                window.location.href = '/home';
            }
        }
    </script>
</body>
</html>
