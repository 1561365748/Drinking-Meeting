<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">完善信息 - 奶茶君</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #FF6B9D;
            --secondary-color: #FFB6C1;
            --accent-color: #FF8C42;
            --dark-color: #2D3436;
            --light-color: #FFF5F8;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #FFF5F8 0%, #FFE4EC 100%);
            min-height: 100vh;
            padding: 30px 0;
        }

        .setup-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .setup-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(255, 107, 157, 0.15);
        }

        .setup-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .setup-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .setup-title {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--dark-color);
            margin-bottom: 10px;
        }

        .setup-subtitle {
            color: #888;
            font-size: 0.95rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--dark-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .section-title i {
            margin-right: 10px;
            color: var(--primary-color);
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-card {
            background: #f8f9fa;
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .option-card.selected {
            border-color: var(--primary-color);
            background: var(--light-color);
        }

        .option-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .option-name {
            font-weight: 500;
            color: var(--dark-color);
            font-size: 0.95rem;
        }

        .skip-hint {
            text-align: center;
            color: #999;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            border: none;
            border-radius: 12px;
            color: white;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
        }

        .section-card {
            background: var(--light-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .progress-steps {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .step {
            display: flex;
            align-items: center;
        }

        .step-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #999;
        }

        .step.active .step-circle {
            background: var(--primary-color);
            color: white;
        }

        .step.done .step-circle {
            background: #4CAF50;
            color: white;
        }

        .step-line {
            width: 50px;
            height: 2px;
            background: #eee;
            margin: 0 10px;
        }

        .step.done + .step .step-line,
        .step-line.done {
            background: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="setup-card">
            <div class="setup-header">
                <div class="setup-icon">
                    <i class="bi bi-person-plus"></i>
                </div>
                <h1 class="setup-title">完善您的信息</h1>
                <p class="setup-subtitle">帮助我们更好地为您推荐奶茶</p>
            </div>

            <form id="setupForm">
                <!-- 疾病史 -->
                <div class="section-card">
                    <h4 class="section-title">
                        <i class="bi bi-heart-pulse"></i> 疾病史（可多选）
                    </h4>
                    <div class="option-grid" id="diseaseOptions">
                        <div class="option-card" onclick="toggleOption(this, 'disease')">
                            <div class="option-icon">🩺</div>
                            <div class="option-name">糖尿病</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'disease')">
                            <div class="option-icon">💊</div>
                            <div class="option-name">高血压</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'disease')">
                            <div class="option-icon">🏃</div>
                            <div class="option-name">减肥中</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'disease')">
                            <div class="option-icon">💪</div>
                            <div class="option-name">健身中</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'disease')">
                            <div class="option-icon">🤰</div>
                            <div class="option-name">孕期</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'disease')">
                            <div class="option-icon">✅</div>
                            <div class="option-name">无</div>
                        </div>
                    </div>
                </div>

                <!-- 忌口/过敏 -->
                <div class="section-card">
                    <h4 class="section-title">
                        <i class="bi bi-shield-x"></i> 忌口/过敏（可多选）
                    </h4>
                    <div class="option-grid" id="allergyOptions">
                        <div class="option-card" onclick="toggleOption(this, 'allergy')">
                            <div class="option-icon">🥛</div>
                            <div class="option-name">乳糖不耐受</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'allergy')">
                            <div class="option-icon">🥜</div>
                            <div class="option-name">花生过敏</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'allergy')">
                            <div class="option-icon">🌰</div>
                            <div class="option-name">坚果过敏</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'allergy')">
                            <div class="option-icon">🥭</div>
                            <div class="option-name">芒果过敏</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'allergy')">
                            <div class="option-icon">🍓</div>
                            <div class="option-name">草莓过敏</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'allergy')">
                            <div class="option-icon">🌾</div>
                            <div class="option-name">麸质过敏</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'allergy')">
                            <div class="option-icon">🧊</div>
                            <div class="option-name">不能喝冷饮</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'allergy')">
                            <div class="option-icon">☕</div>
                            <div class="option-name">不能摄入咖啡因</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'allergy')">
                            <div class="option-icon">✅</div>
                            <div class="option-name">无</div>
                        </div>
                    </div>
                </div>

                <!-- 口味偏好 -->
                <div class="section-card">
                    <h4 class="section-title">
                        <i class="bi bi-heart"></i> 口味偏好（可多选）
                    </h4>
                    <div class="option-grid" id="flavorOptions">
                        <div class="option-card" onclick="toggleOption(this, 'flavor')">
                            <div class="option-icon">🍯</div>
                            <div class="option-name">甜</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'flavor')">
                            <div class="option-icon">🍃</div>
                            <div class="option-name">清爽</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'flavor')">
                            <div class="option-icon">🧀</div>
                            <div class="option-name">浓郁</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'flavor')">
                            <div class="option-icon">🍇</div>
                            <div class="option-name">果茶</div>
                        </div>
                        <div class="option-card" onclick="toggleOption(this, 'flavor')">
                            <div class="option-icon">🥤</div>
                            <div class="option-name">奶茶</div>
                        </div>
                    </div>
                </div>

                <p class="skip-hint">以上信息可以稍后在个人中心修改</p>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <i class="bi bi-check-lg"></i> 完成设置，开始探索
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 存储选择
        const selections = {
            disease: [],
            allergy: [],
            flavor: []
        };

        function toggleOption(element, type) {
            element.classList.toggle('selected');
            const name = element.querySelector('.option-name').textContent;

            if (element.classList.contains('selected')) {
                // 如果选择"无"，取消其他选择
                if (name === '无') {
                    const siblings = element.parentElement.querySelectorAll('.option-card');
                    siblings.forEach(sibling => {
                        if (sibling !== element) {
                            sibling.classList.remove('selected');
                        }
                    });
                    selections[type] = ['无'];
                } else {
                    // 选择其他选项时，取消"无"的选择
                    if (selections[type].includes('无')) {
                        const noneCard = element.parentElement.querySelector('.option-card:last-child');
                        if (noneCard) {
                            noneCard.classList.remove('selected');
                        }
                        selections[type] = selections[type].filter(item => item !== '无');
                    }
                    if (!selections[type].includes(name)) {
                        selections[type].push(name);
                    }
                }
            } else {
                selections[type] = selections[type].filter(item => item !== name);
            }
        }

        // 表单提交
        document.getElementById('setupForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>保存中...';

            try {
                const userId = localStorage.getItem('userId');

                const response = await fetch('/api/user/profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: userId,
                        diseaseHistory: selections.disease,
                        allergies: selections.allergy,
                        preferredFlavors: selections.flavor
                    })
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = '/home';
                } else {
                    alert(result.message || '保存失败，请重试');
                }
            } catch (error) {
                console.error('Save error:', error);
                alert('网络错误，请重试');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-check-lg"></i> 完成设置，开始探索';
            }
        });

        // 检查登录状态
        window.onload = function() {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                window.location.href = '/login';
            }
        };
    </script>
</body>
</html>
