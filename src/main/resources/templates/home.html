<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">首页 - 奶茶君</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #FF6B9D;
            --secondary-color: #FFB6C1;
            --accent-color: #FF8C42;
            --dark-color: #2D3436;
            --light-color: #FFF5F8;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #FFF5F8 0%, #FFE4EC 100%);
            min-height: 100vh;
            padding-top: 80px;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(255, 107, 157, 0.1);
        }

        .navbar-brand {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary-color) !important;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .hero-section {
            text-align: center;
            padding: 60px 0;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--dark-color);
            margin-bottom: 20px;
        }

        .hero-title span {
            color: var(--primary-color);
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 40px;
        }

        .feature-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .feature-card {
            background: white;
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(255, 107, 157, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .feature-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(255, 107, 157, 0.2);
        }

        .feature-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }

        .feature-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--dark-color);
            margin-bottom: 10px;
        }

        .feature-desc {
            color: #888;
            font-size: 0.95rem;
        }

        .hot-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(255, 107, 157, 0.1);
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-header h3 {
            margin: 0;
            font-weight: bold;
            color: var(--dark-color);
        }

        .section-header i {
            color: var(--accent-color);
            margin-right: 10px;
            font-size: 1.5rem;
        }

        .hot-list {
            display: grid;
            gap: 15px;
        }

        .hot-item {
            display: flex;
            align-items: center;
            background: var(--light-color);
            border-radius: 15px;
            padding: 15px;
            transition: all 0.3s;
        }

        .hot-item:hover {
            transform: translateX(5px);
        }

        .hot-rank {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .rank-1 { background: linear-gradient(135deg, #FFD700, #FFA500); }
        .rank-2 { background: linear-gradient(135deg, #C0C0C0, #A0A0A0); }
        .rank-3 { background: linear-gradient(135deg, #CD7F32, #8B4513); }
        .rank-other { background: var(--primary-color); }

        .hot-info {
            flex: 1;
        }

        .hot-name {
            font-weight: 600;
            color: var(--dark-color);
        }

        .hot-brand {
            font-size: 0.85rem;
            color: #888;
        }

        .hot-calorie {
            font-size: 0.9rem;
            color: var(--accent-color);
            font-weight: 500;
        }

        .logout-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 5px 10px;
        }

        .logout-btn:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/home">
                <i class="bi bi-cup-straw"></i>奶茶君
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="/calorie" class="btn btn-outline-warning btn-sm">
                    <i class="bi bi-fire"></i> 热量计算
                </a>
                <a href="/recommend" class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-stars"></i> 智能推荐
                </a>
                <a href="/history" class="btn btn-outline-info btn-sm">
                    <i class="bi bi-clock-history"></i> 历史
                </a>
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <span id="userName">用户</span>
                </div>
                <button class="logout-btn" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Hero Section -->
        <div class="hero-section">
            <h1 class="hero-title">
                你好，<span id="welcomeName">奶茶爱好者</span>！
            </h1>
            <p class="hero-subtitle">
                今天想喝什么？让我们帮你找到最适合的奶茶
            </p>
        </div>

        <!-- 功能卡片 -->
        <div class="feature-cards">
            <a href="/recommend" class="feature-card">
                <div class="feature-icon">🤖</div>
                <h3 class="feature-title">AI智能推荐</h3>
                <p class="feature-desc">三种推荐算法，为你精准匹配最爱的奶茶</p>
            </a>
            <a href="/calorie" class="feature-card">
                <div class="feature-icon">🔥</div>
                <h3 class="feature-title">热量计算</h3>
                <p class="feature-desc">计算奶茶热量，了解营养成分</p>
            </a>
            <a href="/history" class="feature-card">
                <div class="feature-icon">📜</div>
                <h3 class="feature-title">历史记录</h3>
                <p class="feature-desc">查看你的点单历史和口味偏好</p>
            </a>
        </div>

        <!-- 热门推荐 -->
        <div class="hot-section">
            <div class="section-header">
                <i class="bi bi-fire"></i>
                <h3>本周热门</h3>
            </div>
            <div class="hot-list" id="hotList">
                <!-- 动态加载 -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 检查登录状态
        function checkLogin() {
            const userId = localStorage.getItem('userId');
            const userName = localStorage.getItem('userName');

            if (!userId) {
                window.location.href = '/login';
                return null;
            }

            // 更新用户信息显示
            document.getElementById('userName').textContent = userName || userId;
            document.getElementById('welcomeName').textContent = userName || '奶茶爱好者';
            document.getElementById('userAvatar').textContent = (userName || userId).substring(0, 1);

            return userId;
        }

        // 加载热门推荐
        async function loadHotList() {
            try {
                const response = await fetch('/api/hot');
                const data = await response.json();

                const hotList = document.getElementById('hotList');
                hotList.innerHTML = '';

                data.slice(0, 5).forEach((item, index) => {
                    const rankClass = index < 3 ? `rank-${index + 1}` : 'rank-other';
                    const html = `
                        <div class="hot-item">
                            <div class="hot-rank ${rankClass}">${index + 1}</div>
                            <div class="hot-info">
                                <div class="hot-name">${item.productName}</div>
                                <div class="hot-brand">${item.brandName}</div>
                            </div>
                            <div class="hot-calorie">${item.calorie || '--'} 大卡</div>
                        </div>
                    `;
                    hotList.innerHTML += html;
                });
            } catch (error) {
                console.error('Load hot list error:', error);
            }
        }

        // 登出
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('userId');
                localStorage.removeItem('userName');
                window.location.href = '/login';
            }
        }

        // 初始化
        window.onload = function() {
            const userId = checkLogin();
            if (userId) {
                loadHotList();
            }
        };
    </script>
</body>
</html>
